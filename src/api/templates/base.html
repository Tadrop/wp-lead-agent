<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Universal WordPress Agent{% endblock %}</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --border: #30363d;
    --fg: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --good: #3fb950;
    --bad: #f85149;
    --neutral: #d29922;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);
           display: flex; gap: 1rem; align-items: center; }
  header a { color: var(--accent); text-decoration: none; font-weight: 600; }
  main { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
  h1 { margin: 0 0 1rem; font-size: 1.4rem; }
  h2 { margin: 1.5rem 0 0.5rem; font-size: 1.1rem; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; background: var(--panel);
          border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  th, td { padding: 0.6rem 0.8rem; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: #1c222b; color: var(--muted); font-weight: 500; font-size: 0.85rem;
       text-transform: uppercase; letter-spacing: 0.05em; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #1c222b; }
  a { color: var(--accent); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px;
          font-size: 0.75rem; font-family: var(--mono); }
  .pill.good { background: rgba(63,185,80,0.15); color: var(--good); }
  .pill.bad  { background: rgba(248,81,73,0.15); color: var(--bad); }
  .pill.neutral { background: rgba(210,153,34,0.15); color: var(--neutral); }
  .stats { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .stat { background: var(--panel); border: 1px solid var(--border);
          border-radius: 6px; padding: 0.8rem 1rem; min-width: 130px; }
  .stat .n { font-size: 1.4rem; font-weight: 600; }
  .stat .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
  pre { background: var(--panel); border: 1px solid var(--border); padding: 0.8rem;
        border-radius: 6px; overflow-x: auto; font-family: var(--mono); font-size: 0.85rem; }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 250px; }
  code { font-family: var(--mono); }
</style>
</head>
<body>
<header>
  <a href="/admin">Universal WP Agent</a>
  <span class="muted">/ {% block crumb %}{% endblock %}</span>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>

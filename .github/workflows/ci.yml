name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      # Avoid live DNS / live API calls in CI
      ANTHROPIC_API_KEY: "ci-no-network"
      WEBHOOK_DEFAULT_SECRET: "ci-secret"
      EMAIL_CHECK_DELIVERABILITY: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          python -m pip install ruff==0.8.3
          ruff check src tests

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  smoke-api:
    name: smoke (uvicorn boots)
    runs-on: ubuntu-latest
    needs: test
    env:
      ANTHROPIC_API_KEY: "ci-no-network"
      WEBHOOK_DEFAULT_SECRET: "ci-secret"
      EMAIL_CHECK_DELIVERABILITY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Boot FastAPI in background
        run: |
          python -m uvicorn src.api:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health.json 2>/dev/null; then
              echo "API up"
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          echo "API did not start"
          exit 1
